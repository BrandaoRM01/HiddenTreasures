{% extends 'base.html' %}
{% block titulo %}Gerenciar Promoções - HiddenTreasures{% endblock titulo %}

{% block conteudo %}

<div class="container mt-4">
    <div class="text-center mb-5">
        <h1 class="fw-bold">Gerenciar Promoções</h1>
    </div>

    <div class="card p-4 mb-4 shadow">
        <form id="form-promocoes">

            <div class="mb-3">
                <label for="titulo" class="form-label">
                    Título da Promoção <span class="text-danger">*</span>
                </label>
                <input id="titulo" name="titulo" type="text" class="form-control"
                    placeholder="Digite o título da promoção" required>
            </div>

            <div class="mb-3">
                <label for="descricao" class="form-label">
                    Descrição
                </label>
                <textarea id="descricao" name="descricao" class="form-control" rows="3"
                    placeholder="Descreva a promoção"></textarea>
            </div>

            <div class="mb-3">
                <label for="desconto" class="form-label">
                    Desconto (%) <span class="text-danger">*</span>
                </label>
                <input id="desconto" name="desconto" type="number" step="0.01" class="form-control" placeholder="Ex: 10"
                    required>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="data_inicio" class="form-label">
                            Data de Início <span class="text-danger">*</span>
                        </label>
                        <input id="data_inicio" name="data_inicio" type="date" class="form-control" required>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="data_fim" class="form-label">
                            Data de Fim <span class="text-danger">*</span>
                        </label>
                        <input id="data_fim" name="data_fim" type="date" class="form-control" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Adicionar
            </button>

        </form>
    </div>

    <div id="lista-promocoes" class="card p-3 shadow">

    </div>
</div>

{% endblock conteudo %}

{% block js %}
<script type="module" src="{{ url_for('static', filename='js/promocao/cadastrar.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='js/promocao/listar.js') }}"></script>
{% endblock js %}
