{% extends 'base.html' %}
{% block titulo %}Editar Perfil - HiddenTreasures{% endblock titulo %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock css %}

{% block conteudo %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow p-4">

            <h3 class="text-center mb-3">Editar Perfil</h3>

            <div class="text-center mb-4">
                <p class="text-muted mb-1 small">Conta vinculada</p>
                <p class="fw-semibold mb-0">
                    <i class="bi bi-envelope me-1"></i>
                    <span id="texto-email"></span>
                </p>
            </div>

            <form id="form-editar-perfil">

                <div class="text-center mb-4">
                    <img id="preview-imagem" src="" class="rounded-circle shadow"
                        style="width: 110px; height: 110px; object-fit: cover; object-position: top; cursor: pointer;">

                    <input name="foto" type="file" hidden id="foto-imagem" accept="image/*">

                    <div class="mt-2">
                        <label class="btn btn-outline-primary btn-sm me-2" for="foto-imagem">
                            <i class="bi bi-upload"></i> Trocar foto
                        </label>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                    <input name="username" id="input-username" type="text" class="form-control">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nova senha</label>

                        <div class="input-group">
                            <input name="senha" type="password" class="form-control" id="perfil_senha">

                            <span class="input-group-text toggle-password" data-target="perfil_senha"
                                style="cursor:pointer;">
                                <img id="eye-perfil_senha" width="20">
                            </span>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Confirmar senha</label>

                        <div class="input-group">
                            <input name="confirmar_senha" type="password" class="form-control"
                                id="perfil_confirmar_senha">

                            <span class="input-group-text toggle-password" data-target="perfil_confirmar_senha"
                                style="cursor:pointer;">
                                <img id="eye-perfil_confirmar_senha" width="20">
                            </span>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-2">Salvar Alterações</button>

            </form>

        </div>
    </div>
</div>

<script type="module" src="{{ url_for('static', filename='js/usuario/editar.js') }}"></script>

{% endblock conteudo %}
