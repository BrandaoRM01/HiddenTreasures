{% extends 'base.html' %}
{% block titulo %}Editar Avaliação{% endblock titulo %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/avaliacoes.css') }}">
{% endblock css %}

{% block conteudo %}

<div class="container mt-4">

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h4 class="mb-3" id="titulo-editar">Editar Avaliação</h4>

            <form id="form-editar">

                <div class="mb-3">
                    <label class="form-label">Nota <span class="text-danger">*</span></label>
                    <div class="stars" id="stars-container"></div>
                    <input type="hidden" id="nota" required>
                </div>

                <div class="mb-3">
                    <label for="comentario" class="form-label">Comentário</label>
                    <textarea id="comentario" class="form-control" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary me-2">Salvar</button>
                <a id="voltar" class="btn btn-secondary">Voltar</a>
            </form>
        </div>
    </div>

</div>

{% endblock conteudo %}

{% block js %}
<script type="module" src="{{ url_for('static', filename='js/avaliacao/editar.js') }}"></script>
{% endblock js %}
