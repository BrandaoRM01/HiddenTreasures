{% extends 'base.html' %}
{% block titulo %}Gerenciar Categorias - HiddenTreasures{% endblock titulo %}

{% block conteudo %}

<div class="container mt-4">
    <div class="text-center mb-5">
        <h1 class="fw-bold">Gerenciar Categorias</h1>
    </div>

    <div class="card p-3 mb-4 shadow">
        <form id="form-categoria">

            <div class=" mb-3">
                <label for="nome" class="form-label">
                    Nome da Categoria <span class="text-danger">*</span>
                </label>
                <input type="text" id="nome" name="nome" class="form-control" placeholder="Digite o nome da categoria"
                    required>
            </div>

            <div class="mb-3">
                <label for="descricao" class="form-label">
                    Descrição
                </label>
                <textarea id="descricao" name="descricao" class="form-control"
                    placeholder="Digite uma descrição"></textarea>
            </div>

            <button class="btn btn-primary w-100">
                Adicionar
            </button>

        </form>
    </div>

    <div class="card p-4 shadow">
        <div id="lista-categorias"></div>
    </div>

</div>

{% endblock conteudo %}

{% block js %}
<script type="module" src="{{ url_for('static', filename='js/categoria/cadastrar.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='js/categoria/listar.js') }}"></script>
{% endblock js %}
