<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}HiddenTreasures{% endblock titulo %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    {% block css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% endblock css %}
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#" id="link-home-brand">HiddenTreasures</a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="#" id="link-home">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#" id="link-pontos">Pontos Turísticos</a>
                    </li>

                    <li class="nav-item d-none" id="item-sugerir-ponto">
                        <a class="nav-link" href="#" id="link-sugerir-ponto">
                            Sugerir Ponto
                        </a>
                    </li>

                    <li class="nav-item d-none" id="item-favoritos">
                        <a class="nav-link" href="#" id="link-favoritos">
                            Favoritos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#" id="link-sobre">Sobre</a>
                    </li>

                    <li class="nav-item d-none" id="item-painel-admin">
                        <a class="nav-link text-warning fw-semibold" href="#" id="link-painel-admin">
                            Painel Admin
                        </a>
                    </li>

                </ul>

                <div id="area-auth" class="d-none">
                    <div class="d-flex gap-2">
                        <a href="#" id="link-login" class="btn btn-outline-primary">Login</a>
                        <a href="#" id="link-cadastro" class="btn btn-primary">Cadastrar</a>
                    </div>
                </div>

                <div class="dropdown d-none" id="area-usuario">
                    <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark"
                        data-bs-toggle="dropdown">

                        <img id="navbar-foto-usuario" src="" alt="Foto de perfil" class="rounded-circle" width="38"
                            height="38" style="object-fit: cover;">

                        <span class="ms-2" id="navbar-username"></span>
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#" id="btn-logout">Logout</a></li>
                        <li><a class="dropdown-item" href="#" id="link-editar-perfil">Editar Perfil</a></li>
                        <li id="item-excluir-perfil" class="d-none">
                            <a class="dropdown-item text-danger" href="#" id="btn-excluir-perfil">
                                Excluir Perfil
                            </a>
                        </li>
                    </ul>
                </div>

            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-5">

        <div id="container-alertas"></div>

        {% block conteudo %}

        {% endblock conteudo %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="{{ url_for('static', filename='js/nav.js') }}"></script>

    {% block js %}
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% endblock js %}

</body>

</html>
